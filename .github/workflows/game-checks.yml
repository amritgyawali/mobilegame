name: Godot game rules
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce Android-only exports
        run: python tools/check_android_policy.py
      - name: Download pinned official editor
        shell: pwsh
        run: |
          $lock = Get-Content tools/godot-release-lock.json -Raw | ConvertFrom-Json
          $asset = $lock.assets | Where-Object name -eq 'Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest $asset.browser_download_url -OutFile godot.zip
          if ((Get-FileHash godot.zip -Algorithm SHA256).Hash.ToLower() -ne $asset.digest.Split(':')[1]) { throw 'Editor checksum mismatch' }
          Expand-Archive godot.zip -DestinationPath godot
      - name: Import and check active game
        shell: pwsh
        run: |
          & ./godot/Godot_v4.7.2-stable_win64_console.exe --headless --path SummitShards --editor --import --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @('rules', 'run', 'meta', 'scene', 'expedition_scene')) {
            & ./godot/Godot_v4.7.2-stable_win64_console.exe --headless --path SummitShards --script "res://tests/${test}_test.gd"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
